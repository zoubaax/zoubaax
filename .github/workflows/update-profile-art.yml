name: Update profile cards

# Refreshes contribution data and renders animated profile SVG cards daily.
# Runs daily on schedule, on manual dispatch, and on push to main.
# Built entirely with standard library Python (zero external dependencies).

on:
  schedule:
    - cron: "17 5 * * *"  # ~05:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape live contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: zoubaax

      - name: Render animated SVG cards
        run: python scripts/render_cards.py

      - name: Commit updated profile art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph & animated cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
